<header>
  <button
    (click)="routeToCV()"
    class="mt-2 mb-2"
    matButton>
    <mat-icon>keyboard_arrow_left</mat-icon>
    {{"ALL_CALCULATIONS" | scopedTranslation}}
  </button>

  <h3>
    {{"MODEL_NAME" | scopedTranslation}}
    @if (calculation().publicationDate) {
      {{ "FROM" | scopedTranslation }} {{calculation().publicationDate | date}}
    }
  </h3>
</header>

<app-calculation-form
  #calcForm
  [calculation]="calculation()" />

<footer class="bottom">
  <button
    [disabled]="calcForm.calculationForm().invalid()"
    type="button"
    (click)="saveForm(calcForm)"
    matButton="filled">
    @if (isAdd()) {
      {{"FORM.ADD.BUTTONS.ACTION" | scopedTranslation}}
    } @else {
      {{"FORM.EDIT.BUTTONS.ACTION" | scopedTranslation}}
    }
  </button>
  <button
    (click)="routeToCV()"
    type="button"
    matButton>
    {{"FORM.EDIT.BUTTONS.CANCEL" | scopedTranslation}}
  </button>
</footer>
