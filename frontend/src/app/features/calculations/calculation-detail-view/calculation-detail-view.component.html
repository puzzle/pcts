<header>
  <button
    (click)="routeToCV()"
    class="mt-2 mb-2"
    matButton>
    <mat-icon>keyboard_arrow_left</mat-icon>
    {{"ALL_CALCULATIONS" | scopedTranslation}}
  </button>

  <h3>
    {{"MODEL_NAME" | scopedTranslation}}
    @if (calculation().publicationDate) {
      {{ "FROM" | scopedTranslation }} {{calculation().publicationDate | date}}
    }
  </h3>
</header>

<app-calculation-form
  #calcForm
  [isReadOnly]="isArchived()"
  [calculation]="calculation()" />

@if (!isArchived()) {
  <footer class="bottom">
    <app-submit-button
      [disabled]="calcForm.calculationForm().invalid()"
      (saveClicked)="saveForm(calcForm)"
      [text]="(isAdd() ? 'FORM.ADD.BUTTONS.ACTION' : 'FORM.EDIT.BUTTONS.ACTION') | scopedTranslation" />
    <app-cancel-button
      (cancelClicked)="routeToCV()"
      [text]="'FORM.EDIT.BUTTONS.CANCEL' | scopedTranslation" />
  </footer>
}
