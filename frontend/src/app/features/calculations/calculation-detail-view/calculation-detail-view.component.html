<button
  [routerLink]="['member']"
  matButton>
  <mat-icon>keyboard_arrow_left</mat-icon>
  Alle Berechnungen
</button>

<h3>
  Berechnung 1 vom 03. Juni 2025
</h3>

<app-generic-radio-form-table *appTranslationScope="'EXPERIENCE'" [formField]="calculationForm.experienceCalculations" [table]="getTableData()"/>

<div class="sticky-bottom position-absolute">
  <mat-form-field>
<button
  type="button"
  (click)="saveForm()"
matButton="filled">
  {{"FORM.SAVE_FORM" | scopedTranslation}}
</button>
  </mat-form-field>
  <mat-form-field>
    <button
      matButton>
      {{"FORM.CANCEL" | scopedTranslation}}
    </button>
  </mat-form-field>
</div>
