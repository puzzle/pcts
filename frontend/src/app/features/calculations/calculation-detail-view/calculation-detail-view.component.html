<!--todo Add Translation-->
<button
  (click)="routeToCV()"
  matButton>
  <mat-icon>keyboard_arrow_left</mat-icon>
  Alle Berechnungen
</button>

<!--todo Add Translation-->
<h3>
  Berechnung 1 vom 03. Juni 2025
</h3>

<div class="d-flex flex-row justify-content-start gap-5">
  <div class="d-flex flex-column gap-1">
    <span>{{ "POINTS" | scopedTranslation }}</span>
    <span class="points">{{calculation().points.toFixed(2)}}</span>
  </div>
  <div class="d-flex flex-column gap-1">
    <label for="status">{{ "STATE" | scopedTranslation }}</label>
    <mat-form-field >
      <mat-select [formField]="calculationForm.state" id="status">
        @for (state of calculationState; track state) {
          <mat-option [value]="state">{{state | scopedTranslation}}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
</div>

<div class="d-flex flex-column gap-5">
  <app-generic-radio-form-table *appTranslationScope="'EXPERIENCE'" [formField]="calculationForm.experienceCalculations" [table]="experienceTable"/>

  <div>
    <h4>
      {{"CERTIFICATE.MODEL_NAME" | scopedTranslation}}
    </h4>
    <app-generic-table [dataSource]="certificateTable" [disableSorting]="true"/>
  </div>

  <div>
    <h4>
      {{"LEADERSHIP_EXPERIENCE.MODEL_NAME" | scopedTranslation}}
    </h4>

    <app-generic-table [dataSource]="leadershipExperienceTable" [disableSorting]="true"/>
  </div>
</div>

<div class="bottom">
    <button
      type="button"
      (click)="saveForm()"
    matButton="filled">
      @if (isAdd()) {
        {{"FORM.ADD.BUTTONS.ACTION" | scopedTranslation}}
      } @else {
        {{"FORM.EDIT.BUTTONS.ACTION" | scopedTranslation}}
      }
    </button>
    <button
      (click)="routeToCV()"
      type="button"
      matButton>
      {{"FORM.EDIT.BUTTONS.CANCEL" | scopedTranslation}}
    </button>
</div>
