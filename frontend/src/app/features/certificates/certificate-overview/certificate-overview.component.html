<div class="mt-5">
  <h1 class="pt-3">{{"MODEL_NAME_PLURAL" | scopedTranslation}}</h1>

  <search>
    <div class="w-50 gap-3 d-flex flex-row">
        <mat-form-field
          color="primary"
          appearance="outline"
          class="small-form-field"
          data-testid="search-field"
        >
          <mat-icon matPrefix>search</mat-icon>
          <input
            matInput
            [formControl]="searchControl"
            [placeholder]="'FILTER.SEARCH' | scopedTranslation"
            data-testid="search-input"
          />
        </mat-form-field>

      <mat-form-field
        color="primary"
        appearance="outline"
        class="small-form-field"
      >
        <mat-label>{{"TAGS" | scopedTranslation}}</mat-label>
        <mat-select [formControl]="tagControl" multiple>
          <mat-select-trigger>
            {{"TAGS" | scopedTranslation}}
            @if ((tagControl.value?.length || 0) > 1) {
              ({{tagControl.value?.length}})
            }
          </mat-select-trigger>
          @for (tag of tags; track tag) {
            <mat-option [value]="tag">{{tag}}</mat-option>
          }
        </mat-select>

      </mat-form-field>

      <app-info-icon
        class="filter-info-icon d-flex"
        data-testid="filter-info"
        [message]="'SEARCH.INFO' | scopedTranslation" />
    </div>

    <mat-chip-grid>
      @for (tag of tagControl?.value; track tag) {
        <mat-chip-row (removed)="removeTag(tag)">
          {{tag}}
          <button matChipRemove type="button">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      }
    </mat-chip-grid>
  </search>

  <app-generic-table [dataSource]="table" idAttr="id">
    <ng-template [appTypedTemplate]="table.data"/>

    <ng-template
      appColumnTemplate="tags"
      let-certificate
    >
      <app-certificate-type-tags [tags]="certificate.tags" />
    </ng-template>

    <ng-template
      [appExpandableRow]="table"
      let-certificate
    >
      <app-certificate-detail-view [certificate]="certificate" />
    </ng-template>
  </app-generic-table>
</div>
