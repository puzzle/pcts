@if (authService.isAdmin()) {
<div class="mt-5 pb-5 border-bottom p-3">
  <div class="d-flex gap-4 align-items-center mb-3">
    <h3>{{ "MODEL_NAME" | scopedTranslation }}</h3>
    <app-crud-button mode="add" data-testid="add-calculation-button" [customOnClick]="createCalculation"/>
  </div>
  @if (calculationTable(); as c){
    <app-generic-table crudBasePath="calculation" idAttr="id" [dataSource]="c" (entrySelected)="openCalculation($event)"/>
  }
</div>
} @else if (calculationsResource.value()?.length) {
  <h3 class="p-3">{{ "MODEL_NAME" | scopedTranslation }}</h3>
  <app-calculation-form [isReadOnly]="true" [calculation]="calculationsResource.value()[0]"/>
} @else {
  <app-hint-box class="m-3" [text]="'HINT.NO_ACTIVE_CALCULATIONS' | scopedTranslation" variant="hint"/>
}
