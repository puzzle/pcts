<div class="mt-5">
  <h4 class="pt-3">{{"MODEL_NAME_PLURAL" | scopedTranslation}}</h4>
  <app-generic-table [dataSource]="table()" [disableSorting]="true">
    <ng-template appColumnTemplate="highlyRelevant" let-row>
      <mat-radio-button [checked]="shouldBeChecked(row, Relevancy.STRONGLY)" [name]=getIndexOfRow(row) (change)="changeData(row, Relevancy.STRONGLY)"/>
      @if (isRowInvalid(row)) {
        <mat-error>
          must be filled
        </mat-error>
      }
    </ng-template>
    <ng-template appColumnTemplate="limitedRelevant" let-row>
      <mat-radio-button [checked]="shouldBeChecked(row, Relevancy.NORMAL)" [name]=getIndexOfRow(row) (change)="changeData(row, Relevancy.NORMAL)"/>
    </ng-template>
    <ng-template appColumnTemplate="littleRelevant" let-row>
      <mat-radio-button [checked]="shouldBeChecked(row, Relevancy.POORLY)" [name]=getIndexOfRow(row) (change)="changeData(row, Relevancy.POORLY)"/>
    </ng-template>
  </app-generic-table>
</div>
