<section
  class="hint-box"
  [class.hint]="variant() === HintBoxState.HINT"
  [class.warning]="variant() === HintBoxState.WARNING">

  <div class="d-flex align-items-center gap-2 mb-3">
    <mat-icon
      aria-hidden="true"
      [fontIcon]="icon()" />

    <strong>
      {{ ('HINT_BOX.' + variant()) | scopedTranslation }}
    </strong>
  </div>

  <p>{{ text() }}</p>
</section>
