<section
  class="hint-box"
  [class.hint]="state() === HintBoxState.HINT"
  [class.warning]="state() === HintBoxState.WARNING">

  <div class="d-flex align-items-center gap-2 mb-3">
    <mat-icon
      aria-hidden="true"
      [fontIcon]="config[state()].icon" />

    <strong>
      {{ ('HINT_BOX.' + state()) | scopedTranslation }}
    </strong>
  </div>

  <p>{{ text() }}</p>
</section>
