<section
  class="hint-box"
  [class]="config().class">

  <div class="d-flex align-items-center gap-2 mb-3">
    <mat-icon
      aria-hidden="true"
      [fontIcon]="config().icon" />

    <strong>
      {{ ('HINT_BOX.' + variant()) | scopedTranslation }}
    </strong>
  </div>

  <p>{{ text() }}</p>
</section>
