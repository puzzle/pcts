---
services:
  pcts-backend:
    container_name: pcts-e2e-backend
    # release image, drops the dev setup of the base file (the command would be passed to 'java -jar' as arguments)
    build:
      target: runner
      args:
        MAVEN_PROFILES: ""
    command: !reset null
    volumes: !reset []
    develop: !reset null
    environment:
      SPRING_PROFILES_ACTIVE: e2e-test

  pcts-frontend:
    # release image (nginx) instead of 'pnpm start', drops the dev setup of the base file
    build:
      context: ..
      dockerfile: ./frontend/Dockerfile
      args:
        BUILD_CONFIGURATION: development
    image: !reset null
    working_dir: !reset null
    command: !reset null
    volumes: !reset []
    environment: !override
      # allowed in the CSP connect-src
      PCTS_KEYCLOAK_URL: "http://localhost:${PCTS_KEYCLOAK_PORT:-8544}"
