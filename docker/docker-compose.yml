---
name: pcts

services:
  pcts-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pwd
      POSTGRES_DB: pcts
    ports:
      - "${PCTS_DB_PORT:-5432}:5432"
    profiles: ['', backend, infra, db, migration]

  pcts-wiremock:
    image: wiremock/wiremock:latest
    ports:
      - "${PCTS_WIREMOCK_PORT:-8443}:8080"
    volumes:
      - ./wiremock:/home/wiremock
    profiles: ['', backend, migration]

  pcts-backend:
    build:
      context: ..
      dockerfile: ./backend/Dockerfile
      target: dev
      args:
        MAVEN_PROFILES: dev
    ports:
      - "${PCTS_BACKEND_PORT:-8080}:8080"
      # JDWP, IntelliJ 'Backend-Debug' run config. Bound to localhost only, the debug port allows code execution
      - "127.0.0.1:${PCTS_BACKEND_DEBUG_PORT:-5005}:5005"
    # 'docker compose up --watch': a src change is synced and compiled in the container by dev-recompile (only changed
    # sources, full compile if a file was removed), devtools restarts the app once the compile touched the trigger
    # file. A pom.xml change restarts the container, which does a full compile and picks up new dependencies.
    # Full compile by hand: docker compose exec pcts-backend dev-recompile --full
    develop:
      watch:
        - action: sync+exec
          path: ../backend/src
          target: /app/backend/src
          initial_sync: true
          exec:
            command: dev-recompile
        - action: sync+restart
          path: ../backend/pom.xml
          target: /app/backend/pom.xml
          initial_sync: true
        - action: sync+restart
          path: ../pom.xml
          target: /app/pom.xml
          initial_sync: true
    volumes:
      - ../backend/docker/dev-recompile.sh:/usr/local/bin/dev-recompile:ro
    # every (re)start does a full compile, so a pom.xml change (compose restarts the container) or a
    # 'docker compose restart pcts-backend' leaves no stale classes. The compile also warms up the mvnd daemon used by
    # the watch recompiles, the app itself is started by plain mvn so it doesn't occupy that daemon.
    # maven.test.skip stops spring-boot:run from compiling the tests on every start
    command:
      - sh
      - -c
      - >-
        dev-recompile --full
        && exec mvn -B -f backend/pom.xml -Pdev -Dmaven.test.skip=true -Ddev.debug.address='*:5005'
        -Dspring-boot.run.profiles="$$SPRING_PROFILES_ACTIVE" spring-boot:run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pcts-wiremock
      - pcts-db
      - pcts-keycloak
    environment:
      PCTS_SPRING_DATASOURCE_URL: pcts-db
      SPRING_PROFILES_ACTIVE: dev
      # devtools only restarts once a recompile is complete (dev-recompile touches the trigger file), so the
      # poll/quiet period can be short without restarting on a half written target/classes
      SPRING_DEVTOOLS_RESTART_TRIGGER_FILE: .reloadtrigger
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 200ms
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 50ms
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "false"
      # must match the issuer Keycloak writes into the tokens (KC_HOSTNAME), keys are fetched container-internally
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:${PCTS_KEYCLOAK_PORT:-8544}/realms/pitc"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://pcts-keycloak:8544/realms/pitc/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES_0: pcts-dev
      PCTS_FRONTEND_KEYCLOAK_URL: "http://localhost:${PCTS_KEYCLOAK_PORT:-8544}"
    profiles: ['', backend, migration]

  pcts-frontend:
    depends_on:
      - pcts-backend
      - pcts-keycloak
    build:
      context: ..
      dockerfile: ./frontend/Dockerfile
      args:
        BUILD_CONFIGURATION: development
    ports:
      - "${PCTS_FRONTEND_PORT:-4200}:4200"
    environment:
      # allowed in the CSP connect-src
      PCTS_KEYCLOAK_URL: "http://localhost:${PCTS_KEYCLOAK_PORT:-8544}"
    profiles: ['']

  pcts-keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8544 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin26
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak26
      # the browser talks to Keycloak via its host port (not the dockportless proxy), a full URL keeps the token
      # issuer the same when Keycloak is called container-internally (backend, migration)
      KC_HOSTNAME: "http://localhost:${PCTS_KEYCLOAK_PORT:-8544}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8544"
      # resolved in the realm import: redirect URIs of the pcts-dev client (direct host port and dockportless URL)
      PCTS_FRONTEND_URL: "http://localhost:${PCTS_FRONTEND_PORT:-4200}"
      PCTS_FRONTEND_PROXY_URL: "http://pcts-frontend.${COMPOSE_PROJECT_NAME}.localhost:7355"
    volumes:
      - ./config/realm-export-pitc.json:/opt/keycloak/data/import/realm-pitc.json
    command:
      - start-dev
      - --import-realm
    ports:
      - "${PCTS_KEYCLOAK_PORT:-8544}:8544"
    profiles: ['', backend, infra, migration]

  pcts-migration:
    build:
      context: ..
      dockerfile: ./migration/Dockerfile
    ports:
      - "${PCTS_MIGRATION_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    links:
      - "pcts-keycloak:localhost"
    depends_on:
      pcts-keycloak:
        condition: service_healthy
      pcts-backend:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      BACKEND_API_BASE_URL: http://pcts-backend:8080
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://pcts-keycloak:8544/realms/pitc/protocol/openid-connect/token
    profiles: [migration]
